{% extends "base.html" %}

{% block content %}
    <h1>Post Submitted Successfully</h1>
    <p>Your post has been submitted with the following details:</p>
    {% if posts %}
        {% for post in posts %}
            <h2>{{ post.title }}</h2>
            <p>{{ post.content }}</p>
        {% endfor %}
    {% else %}
        <p>No data received.</p>
    {% endif %}
{% endblock %}
